name: Reusable residential synthetic

on:
  workflow_call:
    inputs:
      command:
        type: string
        required: true
      artifact-path:
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ci-pool-residential-egress
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Synthetic check
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Failure evidence
        if: failure() && inputs.artifact-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-failure-${{ github.run_id }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
          retention-days: 7

