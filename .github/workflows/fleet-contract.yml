name: Reusable fleet repository contract

on:
  workflow_call:
    inputs:
      profile:
        description: Repository contract profile.
        type: string
        required: true
      implementation-ref:
        description: Exact workflows repository commit containing the contract implementation.
        type: string
        required: true
      allow-arm64:
        description: Allow an explicit ARM64/AArch64 installer and package contract.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 5

permissions:
  contents: read

jobs:
  contract:
    runs-on: ci-pool-ops
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out caller
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target
          persist-credentials: false
      - name: Check out immutable contract implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dinglebear-ai/workflows
          ref: ${{ inputs.implementation-ref }}
          path: workflow-library
          persist-credentials: false
      - name: Validate repository contract
        env:
          PROFILE: ${{ inputs.profile }}
          ALLOW_ARM64: ${{ inputs.allow-arm64 }}
        run: |
          args=()
          if [[ "$ALLOW_ARM64" == "true" ]]; then
            args+=(--allow-arm64)
          fi
          python3 workflow-library/scripts/fleet_contract.py check \
            --repo target \
            --profile "$PROFILE" \
            "${args[@]}"
