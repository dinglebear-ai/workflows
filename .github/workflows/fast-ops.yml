name: Reusable fast operations CI

on:
  workflow_call:
    inputs:
      shell-globs:
        type: string
        default: "**/*.sh"
      actionlint-version:
        type: string
        default: "v1.7.7"
      policy-command:
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  ops:
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install pinned actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@$VERSION"
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - run: actionlint
      - name: ShellCheck and parse shell
        env:
          SHELL_GLOBS: ${{ inputs.shell-globs }}
        run: |
          set -euo pipefail
          read -r -a shell_globs <<< "$SHELL_GLOBS"
          mapfile -d '' files < <(git ls-files -z -- "${shell_globs[@]}")
          ((${#files[@]} == 0)) && exit 0
          shellcheck "${files[@]}"
          for file in "${files[@]}"; do bash -n "$file"; done
      - name: Repository policy
        if: inputs.policy-command != ''
        env:
          COMMAND: ${{ inputs.policy-command }}
        run: bash -euo pipefail -c "$COMMAND"
