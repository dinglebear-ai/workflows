name: Reusable Pages deployment

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      node-version:
        type: string
        default: "22"
      package-cache:
        type: string
        default: npm
      pnpm-version:
        type: string
        default: "10"
      working-directory:
        type: string
        default: "."
      cache-dependency-path:
        type: string
        default: package-lock.json
      install-command:
        type: string
        default: npm ci --no-audit --no-fund
      build-command:
        type: string
        default: npm run build
      artifact-path:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 20

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: inputs.package-cache == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Locked install
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.artifact-path }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
