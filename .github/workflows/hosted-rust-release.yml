name: Reusable hosted Rust release

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      toolchain:
        type: string
        default: "1.97.1"
      working-directory:
        type: string
        default: "."
      preflight-command:
        type: string
        default: cargo test --workspace --locked
      build-command:
        type: string
        default: cargo build --workspace --release --locked
      package-command:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 60
    secrets:
      KACHE_S3_ACCESS_KEY:
        required: true
      KACHE_S3_SECRET_KEY:
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b
        with:
          version: "0.13.0"
          s3-bucket: kache
          s3-region: us-east-1
          s3-prefix: rust
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          manifest-key: release-${{ runner.os }}-x64
          namespace: release-${{ runner.os }}-x64
          cache-executables: "true"
          warm: "true"
          sync: "false"
          pr-comment: "false"
      - name: Verify release gate
        env:
          COMMAND: ${{ inputs.preflight-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build release
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Package exact output
        env:
          COMMAND: ${{ inputs.package-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
