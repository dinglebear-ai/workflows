name: Reusable hosted Incus image build

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      setup-command:
        type: string
        required: true
      validate-command:
        type: string
        required: true
      build-command:
        type: string
        required: true
      smoke-command:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      artifact-directory:
        type: string
        default: dist
      enable-kache:
        description: Enable MinIO-backed Rust caching after the caller's setup command.
        type: boolean
        default: false
      kache-manifest-key:
        description: Manifest key for opt-in Rust compilation during image assembly.
        type: string
        default: hosted-incus-image
      timeout-minutes:
        type: number
        default: 120
    secrets:
      KACHE_S3_ACCESS_KEY:
        required: false
      KACHE_S3_SECRET_KEY:
        required: false

permissions:
  contents: read

jobs:
  incus-image:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: Install pinned Incus image tooling
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Require Kache credentials
        if: inputs.enable-kache
        env:
          KACHE_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          KACHE_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$KACHE_ACCESS_KEY"
          test -n "$KACHE_SECRET_KEY"
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b
        if: inputs.enable-kache
        with:
          version: "0.12.0"
          s3-bucket: kache
          s3-region: us-east-1
          s3-prefix: rust
          s3-endpoint: https://s3.tootie.tv
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          manifest-key: ${{ inputs.kache-manifest-key }}
          namespace: ${{ inputs.kache-manifest-key }}
          warm: "true"
          sync: "false"
          pr-comment: "false"
      - name: Validate image definition and scripts
        env:
          COMMAND: ${{ inputs.validate-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build and export x86_64 image
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Smoke exported image
        env:
          COMMAND: ${{ inputs.smoke-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Require image output
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        run: find "$ARTIFACT_DIRECTORY" -type f -print -quit | grep -q .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ inputs.artifact-directory }}
          format: spdx-json
          output-file: ${{ inputs.artifact-directory }}/image.spdx.json
          upload-artifact: false
      - name: Generate exact checksum inventory
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        run: |
          set -euo pipefail
          (
            cd "$ARTIFACT_DIRECTORY"
            checksum_inventory="$(mktemp)"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > "$checksum_inventory"
            mv "$checksum_inventory" SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-directory }}/
          if-no-files-found: error
          retention-days: 14
