name: Reusable fast Rust CI

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: "1.97.1"
      working-directory:
        type: string
        default: "."
      setup-command:
        description: Optional dependency or fixture setup before Rust validation.
        type: string
        default: ""
      uv-version:
        description: Optional pinned uv version for mixed Rust and Python repositories.
        type: string
        default: ""
      fmt-command:
        type: string
        default: cargo fmt --all -- --check
      check-command:
        type: string
        default: cargo check --workspace --all-targets --all-features --locked
      clippy-command:
        type: string
        default: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      test-command:
        type: string
        default: cargo test --workspace --locked
      timeout-minutes:
        type: number
        default: 20
      kache-manifest-key:
        type: string
        default: fast-rust
    # Retained as optional compatibility inputs for immutable callers pinned
    # to older workflow SHAs. Private runner-farm jobs use the NFS remote and
    # do not consume S3 credentials.
    secrets:
      KACHE_S3_ACCESS_KEY:
        required: false
      KACHE_S3_SECRET_KEY:
        required: false

permissions:
  contents: read

jobs:
  rust:
    runs-on: ci-pool-rust
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # ci-pool-rust is the private Ubuntu 26.04 fleet. Its canonical remote
      # is the bind-mounted NFS cache, not hosted MinIO. The caller repository
      # owns this composite action and its fleet-pinned Kache contract.
      - uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy
          enable-cache: "true"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: inputs.uv-version != ''
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: true
      - name: Project setup
        if: inputs.setup-command != ''
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Format
        env:
          COMMAND: ${{ inputs.fmt-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Check
        env:
          COMMAND: ${{ inputs.check-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Clippy
        env:
          COMMAND: ${{ inputs.clippy-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Targeted tests
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
