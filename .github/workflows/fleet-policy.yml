name: Reusable fleet workflow policy

on:
  workflow_call:
    inputs:
      release-file-regex:
        type: string
        default: '(^|/)(release|publish|deploy)[^/]*\.ya?ml$'
      allow-hosted-fast:
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  policy:
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Enforce invariant workflow shape
        env:
          RELEASE_FILE_REGEX: ${{ inputs.release-file-regex }}
          ALLOW_HOSTED_FAST: ${{ inputs.allow-hosted-fast }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, yaml

          root = pathlib.Path(".github/workflows")
          release_re = re.compile(os.environ["RELEASE_FILE_REGEX"])
          allow_hosted_fast = os.environ["ALLOW_HOSTED_FAST"].lower() == "true"
          sha = re.compile(r"^[0-9a-f]{40}$")
          errors = []

          for path in sorted((*root.glob("*.yml"), *root.glob("*.yaml"))):
              if path.name == "fleet-policy.yml":
                  continue
              text = path.read_text()
              data = yaml.load(text, Loader=yaml.BaseLoader) or {}
              is_release = bool(release_re.search(path.as_posix()))

              if "permissions" not in data:
                  errors.append(f"{path}: missing top-level permissions")
              if re.search(r"(?i)\b(arm64|aarch64|linux/arm64|setup-qemu)\b", text):
                  errors.append(f"{path}: ARM/QEMU contract is forbidden")

              for match in re.finditer(r"(?m)^\s*uses:\s*([^#\s]+)", text):
                  use = match.group(1)
                  if use.startswith("./"):
                      continue
                  if use.startswith("docker://"):
                      if "@sha256:" not in use:
                          errors.append(f"{path}: mutable container action {use}")
                      continue
                  if "@" not in use or not sha.fullmatch(use.rsplit("@", 1)[1]):
                      errors.append(f"{path}: mutable external action {use}")

              jobs = data.get("jobs", {})
              for name, job in jobs.items():
                  if not isinstance(job, dict) or "uses" in job:
                      continue
                  if "timeout-minutes" not in job:
                      errors.append(f"{path}:{name}: missing timeout-minutes")
                  runner = str(job.get("runs-on", ""))
                  hosted_linux = "ubuntu-" in runner
                  self_hosted = "self-hosted" in runner
                  if is_release and self_hosted:
                      errors.append(f"{path}:{name}: heavy release job is self-hosted")
                  if not is_release and hosted_linux and not allow_hosted_fast:
                      errors.append(f"{path}:{name}: fast Linux job is GitHub-hosted")
                  if self_hosted and "ci-pool-" not in runner:
                      errors.append(f"{path}:{name}: farm job has no pool selector")

          if errors:
              print("\n".join(f"::error::{e}" for e in errors))
              sys.exit(1)
          PY
