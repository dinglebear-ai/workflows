name: Reusable hosted CI image release

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      release-tag:
        type: string
        required: true
      registry:
        type: string
        default: ghcr.io
      image-prefix:
        type: string
        default: dinglebear-ai/workflows-ci
      timeout-minutes:
        type: number
        default: 90

permissions:
  contents: read
  packages: write

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        profile: [rust, python, typescript]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish x86_64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/${{ matrix.profile }}/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ inputs.registry }}/${{ inputs.image-prefix }}-${{ matrix.profile }}:${{ inputs.release-tag }}
            ${{ inputs.registry }}/${{ inputs.image-prefix }}-${{ matrix.profile }}:sha-${{ github.sha }}
            ${{ inputs.registry }}/${{ inputs.image-prefix }}-${{ matrix.profile }}:latest
          cache-from: type=gha,scope=ci-image-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=ci-image-${{ matrix.profile }}
          provenance: true
          sbom: true
          push: true
      - name: Scan exact digest
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image-prefix }}-${{ matrix.profile }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
