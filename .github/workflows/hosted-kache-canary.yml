name: Hosted Kache canary

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-kache-canary.yml"
      - "ci/kache-hosted-canary/**"
      - "docs/workflow-catalog.md"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 0"

concurrency:
  group: hosted-kache-canary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CANARY_MANIFEST: ci/kache-hosted-canary/Cargo.toml
  CANARY_ROOT: ci/kache-hosted-canary
  KACHE_MANIFEST_KEY: hosted-canary-ubuntu-24.04-x64

jobs:
  seed:
    name: Seed hosted remote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # v0.13.0
        with:
          version: "0.13.0"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'kache' }}
          s3-region: us-east-1
          s3-prefix: canary
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || 'https://s3.tootie.tv' }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          cache-executables: "true"
          github-cache: "false"
          sync: "false"
          warm: "true"
          min-compile-ms: "0"
          manifest-key: ${{ env.KACHE_MANIFEST_KEY }}
          namespace: ${{ env.KACHE_MANIFEST_KEY }}
          pr-comment: "false"
      - name: Seed identical release build
        run: cargo build --release --locked --manifest-path "$CANARY_MANIFEST"
      - name: Record seed evidence
        run: |
          kache report --format json --root "$GITHUB_WORKSPACE/$CANARY_ROOT" \
            | jq '.summary | {local_hits, prefetch_hits, remote_hits, misses, errors, fallbacks, store_failures}' \
            >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify fresh hosted remote reuse
    needs: [seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.97.1"
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # v0.13.0
        with:
          version: "0.13.0"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'kache' }}
          s3-region: us-east-1
          s3-prefix: canary
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || 'https://s3.tootie.tv' }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          cache-executables: "true"
          github-cache: "false"
          sync: "false"
          warm: "false"
          min-compile-ms: "0"
          manifest-key: ${{ env.KACHE_MANIFEST_KEY }}
          namespace: ${{ env.KACHE_MANIFEST_KEY }}
          pr-comment: "false"
      - name: Pull the isolated canary cache
        run: |
          kache sync --pull --all --manifest-path "$CANARY_MANIFEST" 2>&1 \
            | tee "$RUNNER_TEMP/kache-sync.log"
          grep -Eq 'Downloaded:[[:space:]]+1/1' "$RUNNER_TEMP/kache-sync.log"
      - name: Build from the synchronized local store
        run: cargo build --release --locked --manifest-path "$CANARY_MANIFEST"
      - name: Drain asynchronous Kache transfers
        run: kache daemon stop
      - name: Require remote cache reuse
        run: |
          kache report --format json | jq '{
                local_hits: (.summary.local_hits // 0),
                prefetch_hits: (.summary.prefetch_hits // 0),
                remote_hits: (.summary.remote_hits // 0),
                misses: (.summary.misses // 0),
                errors: (.summary.errors // 0),
                fallbacks: (.summary.fallbacks // 0),
                store_failures: (.summary.store_failures // 0)
              }' > "$RUNNER_TEMP/kache-evidence.json"
          cat "$RUNNER_TEMP/kache-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            (.local_hits + .remote_hits + .prefetch_hits) > 0 and
            .misses == 0 and
            .errors == 0 and
            .fallbacks == 0 and
            .store_failures == 0
          ' "$RUNNER_TEMP/kache-evidence.json" >/dev/null
