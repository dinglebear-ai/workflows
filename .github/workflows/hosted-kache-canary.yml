name: Hosted Kache canary

on:
  pull_request:
    paths:
      - ".github/workflows/hosted-kache-canary.yml"
      - "ci/kache-hosted-canary/**"
      - "docs/workflow-catalog.md"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 0"

concurrency:
  group: hosted-kache-canary-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CANARY_MANIFEST: ci/kache-hosted-canary/Cargo.toml
  CANARY_ROOT: ci/kache-hosted-canary
  KACHE_MANIFEST_KEY: hosted-canary-ubuntu-24.04-x64

jobs:
  seed:
    name: Seed hosted remote
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b
        with:
          version: "0.12.0"
          s3-bucket: kache
          s3-region: us-east-1
          s3-prefix: rust
          s3-endpoint: https://s3.tootie.tv
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          cache-executables: "true"
          github-cache: "false"
          sync: "false"
          warm: "false"
          manifest-key: ${{ env.KACHE_MANIFEST_KEY }}
          namespace: ${{ env.KACHE_MANIFEST_KEY }}
          pr-comment: "false"
      - name: Seed identical release build
        run: cargo build --release --locked --manifest-path "$CANARY_MANIFEST"
      - name: Record seed evidence
        run: |
          kache report --format json --root "$GITHUB_WORKSPACE/$CANARY_ROOT"             | jq '.summary | {local_hits, remote_hits, misses, errors, fallbacks, store_failures}'             >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify fresh hosted remote hit
    needs: [seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
      - uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b
        with:
          version: "0.12.0"
          s3-bucket: kache
          s3-region: us-east-1
          s3-prefix: rust
          s3-endpoint: https://s3.tootie.tv
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          cache-executables: "true"
          github-cache: "false"
          sync: "false"
          warm: "false"
          manifest-key: ${{ env.KACHE_MANIFEST_KEY }}
          namespace: ${{ env.KACHE_MANIFEST_KEY }}
          pr-comment: "false"
      - name: Snapshot counters before build
        run: |
          kache report --format json --root "$GITHUB_WORKSPACE/$CANARY_ROOT"             | jq '{
                local_hits: (.summary.local_hits // 0),
                remote_hits: (.summary.remote_hits // 0),
                misses: (.summary.misses // 0),
                errors: (.summary.errors // 0),
                fallbacks: (.summary.fallbacks // 0),
                store_failures: (.summary.store_failures // 0)
              }' > "$RUNNER_TEMP/kache-before.json"
      - name: Build from a fresh local store
        run: cargo build --release --locked --manifest-path "$CANARY_MANIFEST"
      - name: Require an on-demand S3 restore
        run: |
          kache report --format json --root "$GITHUB_WORKSPACE/$CANARY_ROOT"             | jq '{
                local_hits: (.summary.local_hits // 0),
                remote_hits: (.summary.remote_hits // 0),
                misses: (.summary.misses // 0),
                errors: (.summary.errors // 0),
                fallbacks: (.summary.fallbacks // 0),
                store_failures: (.summary.store_failures // 0)
              }' > "$RUNNER_TEMP/kache-after.json"
          jq -n             --slurpfile before "$RUNNER_TEMP/kache-before.json"             --slurpfile after "$RUNNER_TEMP/kache-after.json"             '{
              local_hits: ($after[0].local_hits - $before[0].local_hits),
              remote_hits: ($after[0].remote_hits - $before[0].remote_hits),
              misses: ($after[0].misses - $before[0].misses),
              errors: ($after[0].errors - $before[0].errors),
              fallbacks: ($after[0].fallbacks - $before[0].fallbacks),
              store_failures: ($after[0].store_failures - $before[0].store_failures)
            }' > "$RUNNER_TEMP/kache-delta.json"
          cat "$RUNNER_TEMP/kache-delta.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            .remote_hits > 0 and
            .errors == 0 and
            .fallbacks == 0 and
            .store_failures == 0
          ' "$RUNNER_TEMP/kache-delta.json" >/dev/null
