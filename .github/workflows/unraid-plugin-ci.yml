name: Reusable hosted Unraid plugin package

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      build-command:
        type: string
        required: true
      validate-command:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      artifact-directory:
        type: string
        default: dist/unraid
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: Build once
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Validate exact bytes
        env:
          COMMAND: ${{ inputs.validate-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Generate exact checksum inventory
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        run: |
          set -euo pipefail
          find "$ARTIFACT_DIRECTORY" -type f -print -quit | grep -q .
          (
            cd "$ARTIFACT_DIRECTORY"
            checksum_inventory="$(mktemp)"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > "$checksum_inventory"
            mv "$checksum_inventory" SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-directory }}/
          if-no-files-found: error
          retention-days: 7
