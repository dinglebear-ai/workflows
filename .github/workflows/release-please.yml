name: Reusable Release Please

on:
  workflow_call:
    inputs:
      target-branch:
        type: string
        default: main
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
      timeout-minutes:
        type: number
        default: 10
    outputs:
      release-created:
        value: ${{ jobs.release.outputs.release-created }}
      tag-name:
        value: ${{ jobs.release.outputs.tag-name }}
      release-sha:
        value: ${{ jobs.release.outputs.release-sha }}
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      release-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ inputs.target-branch }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
      - name: Resolve immutable release SHA
        id: resolve
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
          test "$sha" = "${GITHUB_SHA}" || {
            echo "::error::release tag $TAG resolves to $sha, expected $GITHUB_SHA"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
