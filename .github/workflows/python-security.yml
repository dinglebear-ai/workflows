name: Reusable fast Python dependency security

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      uv-version:
        type: string
        default: "0.8.4"
      pip-audit-version:
        type: string
        default: "2.9.0"
      working-directory:
        type: string
        default: "."
      export-command:
        type: string
        default: uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, ci-pool-python]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install pinned audit tools
        env:
          UV_VERSION: ${{ inputs.uv-version }}
          PIP_AUDIT_VERSION: ${{ inputs.pip-audit-version }}
        run: |
          python -m pip install --disable-pip-version-check \
            "uv==$UV_VERSION" "pip-audit==$PIP_AUDIT_VERSION"
      - name: Export frozen dependencies
        env:
          COMMAND: ${{ inputs.export-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - run: pip-audit --requirement "$RUNNER_TEMP/requirements.txt"

