name: Reusable hosted Rust x86_64 platform release

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      toolchain:
        type: string
        default: "1.97.1"
      working-directory:
        type: string
        default: "."
      targets-json:
        type: string
        default: >-
          [{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},
           {"runner":"macos-15-intel","target":"x86_64-apple-darwin"},
           {"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}]
      build-command:
        type: string
        default: cargo build --release --locked --target "$TARGET"
      package-command:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      artifact-prefix:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 60
    secrets:
      KACHE_S3_ACCESS_KEY:
        required: false
      KACHE_S3_SECRET_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets-json) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Require x86_64 target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$TARGET" == x86_64-* ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}
      - name: Connect shared MinIO Kache on Linux
        if: runner.os == 'Linux' && env.KACHE_S3_ACCESS_KEY != '' && env.KACHE_S3_SECRET_KEY != ''
        uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # v0.13.0
        with:
          version: "0.13.0"
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'kache' }}
          s3-region: us-east-1
          s3-prefix: ${{ vars.KACHE_S3_PREFIX || 'rust' }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT || 'https://s3.tootie.tv' }}
          s3-access-key-id: ${{ env.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ env.KACHE_S3_SECRET_KEY }}
          manifest-key: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          namespace: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          warm: "true"
          sync: "false"
          pr-comment: "false"
      - name: Build release
        env:
          COMMAND: ${{ inputs.build-command }}
          TARGET: ${{ matrix.target }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Package exact output
        env:
          COMMAND: ${{ inputs.package-command }}
          TARGET: ${{ matrix.target }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.target }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
