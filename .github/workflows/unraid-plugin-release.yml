name: Reusable Unraid plugin release

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      artifact-directory:
        type: string
        default: release-artifacts
      validate-command:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-directory }}
      - name: Verify checksum inventory
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        run: |
          set -euo pipefail
          cd "$ARTIFACT_DIRECTORY"
          sha256sum --check --strict SHA256SUMS
      - name: Revalidate downloaded bytes
        env:
          COMMAND: ${{ inputs.validate-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Publish exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mapfile -d '' files < <(find "$ARTIFACT_DIRECTORY" -type f -print0)
          gh release upload "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
