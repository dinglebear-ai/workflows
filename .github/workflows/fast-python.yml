name: Reusable fast Python CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      uv-version:
        type: string
        default: "0.8.4"
      working-directory:
        type: string
        default: "."
      sync-command:
        type: string
        default: uv sync --frozen --extra test
      lint-command:
        type: string
        default: uv run ruff check .
      format-command:
        type: string
        default: uv run ruff format --check .
      typecheck-command:
        type: string
        default: ""
      test-command:
        type: string
        default: uv run pytest -q
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  python:
    runs-on: [self-hosted, ci-pool-python]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install pinned uv
        env:
          UV_VERSION: ${{ inputs.uv-version }}
        run: python -m pip install --disable-pip-version-check "uv==$UV_VERSION"
      - name: Frozen sync
        env:
          COMMAND: ${{ inputs.sync-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Lint
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Format
        env:
          COMMAND: ${{ inputs.format-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Typecheck
        if: inputs.typecheck-command != ''
        env:
          COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Tests
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"

