name: Reusable official MCP Registry publication

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      expected-version:
        type: string
        default: ""
      version-prefix:
        type: string
        default: v
      manifest-path:
        type: string
        default: server.json
      auth-method:
        type: string
        default: dns
      registry-domain:
        type: string
        default: dinglebear.ai
      package-visible-command:
        type: string
        default: ""
      verify-command:
        type: string
        default: ""
      publisher-version:
        type: string
        default: "1.7.9"
      publisher-sha256:
        type: string
        default: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
      timeout-minutes:
        type: number
        default: 20
    secrets:
      MCP_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: mcp-registry-publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - id: manifest
        name: Validate canonical DingleBear manifest
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          VERSION_PREFIX: ${{ inputs.version-prefix }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.parse
          from pathlib import Path

          path = Path(os.environ["MANIFEST_PATH"])
          if not path.is_file():
              raise SystemExit(f"manifest does not exist: {path}")

          manifest = json.loads(path.read_text(encoding="utf-8"))
          name = manifest.get("name")
          version = manifest.get("version")
          description = manifest.get("description")
          if not isinstance(name, str) or not name.startswith("ai.dinglebear/"):
              raise SystemExit(f"server name must use ai.dinglebear/: {name!r}")
          if not isinstance(version, str) or not version:
              raise SystemExit("manifest version must be a non-empty string")
          if not isinstance(description, str) or not description:
              raise SystemExit("manifest description must be a non-empty string")
          if len(description) > 100:
              raise SystemExit(
                  f"manifest description exceeds the Registry limit: {len(description)} > 100"
              )

          expected = os.environ.get("EXPECTED_VERSION", "")
          prefix = os.environ.get("VERSION_PREFIX", "")
          if expected and prefix and expected.startswith(prefix):
              expected = expected[len(prefix):]
          if expected and expected != version:
              raise SystemExit(
                  f"manifest version {version!r} does not match expected {expected!r}"
              )

          publisher = (
              manifest.get("_meta", {})
              .get("io.modelcontextprotocol.registry/publisher-provided", {})
          )
          if publisher.get("namespace") != "ai.dinglebear":
              raise SystemExit("publisher namespace must be ai.dinglebear")
          if publisher.get("dnsDomain") != "dinglebear.ai":
              raise SystemExit("publisher dnsDomain must be dinglebear.ai")

          repository = manifest.get("repository", {})
          repository_url = repository.get("url", "")
          if "github.com/dinglebear-ai/" not in repository_url:
              raise SystemExit(
                  f"repository URL must belong to dinglebear-ai: {repository_url!r}"
              )

          packages = manifest.get("packages")
          if not isinstance(packages, list) or not packages:
              raise SystemExit("manifest must contain at least one package")
          for index, package in enumerate(packages):
              kind = package.get("registryType")
              identifier = package.get("identifier")
              if not isinstance(identifier, str) or not identifier:
                  raise SystemExit(f"package {index} has no identifier")
              if kind == "npm" and not identifier.startswith("@dinglebear/"):
                  raise SystemExit(
                      f"npm package {index} must use the @dinglebear scope: {identifier}"
                  )
              if kind == "oci" and not identifier.startswith("ghcr.io/dinglebear-ai/"):
                  raise SystemExit(
                      f"OCI package {index} must use ghcr.io/dinglebear-ai/: {identifier}"
                  )
              if kind not in {"npm", "pypi", "oci"}:
                  raise SystemExit(f"unsupported package registryType {kind!r}")

          print(f"name={name}")
          print(f"version={version}")
          print(f"encoded_name={urllib.parse.quote(name, safe='')}")
          print(f"encoded_version={urllib.parse.quote(version, safe='')}")
          PY

      - name: Require referenced package visibility
        env:
          COMMAND: ${{ inputs.package-visible-command }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          if [[ -n "$COMMAND" ]]; then
            bash -euo pipefail -c "$COMMAND"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.parse
          import urllib.request

          manifest = json.load(open(os.environ["MANIFEST_PATH"], encoding="utf-8"))
          manifest_name = manifest["name"]
          manifest_version = manifest["version"]
          last_error = None
          for attempt in range(1, 21):
              try:
                  for package in manifest["packages"]:
                      kind = package["registryType"]
                      identifier = package["identifier"]
                      version = package.get("version") or manifest_version
                      if kind == "npm":
                          spec = f"{identifier}@{version}"
                          raw = subprocess.check_output(
                              ["npm", "view", spec, "version", "mcpName", "--json"],
                              text=True,
                          )
                          metadata = json.loads(raw)
                          if metadata.get("version") != version:
                              raise RuntimeError(
                                  f"npm returned {metadata.get('version')!r} for {spec}"
                              )
                          if metadata.get("mcpName") != manifest_name:
                              raise RuntimeError(
                                  f"npm {spec} mcpName {metadata.get('mcpName')!r} "
                                  f"does not match {manifest_name!r}"
                              )
                      elif kind == "pypi":
                          name = urllib.parse.quote(identifier, safe="")
                          release = urllib.parse.quote(version, safe="")
                          url = f"https://pypi.org/pypi/{name}/{release}/json"
                          with urllib.request.urlopen(url, timeout=30) as response:
                              payload = json.load(response)
                          description = payload.get("info", {}).get("description", "")
                          if f"mcp-name: {manifest_name}" not in description:
                              raise RuntimeError(
                                  f"PyPI {identifier} {version} does not prove {manifest_name} ownership"
                              )
                      elif kind == "oci":
                          subprocess.run(
                              ["docker", "manifest", "inspect", identifier],
                              check=True,
                              stdout=subprocess.DEVNULL,
                          )
                      print(f"visible: {kind}:{identifier}@{version}")
                  print(f"all packages visible with ownership proof (attempt {attempt})")
                  raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  if attempt < 20:
                      print(
                          f"package visibility not ready (attempt {attempt}/20): {error}; "
                          "retrying in 15s"
                      )
                      time.sleep(15)
          raise SystemExit(f"package visibility failed: {last_error}")
          PY

      - name: Install verified mcp-publisher
        env:
          EXPECTED_SHA256: ${{ inputs.publisher-sha256 }}
          VERSION: ${{ inputs.publisher-version }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/${archive}"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - id: registry
        name: Reconcile existing Registry state
        env:
          ENCODED_NAME: ${{ steps.manifest.outputs.encoded_name }}
          ENCODED_VERSION: ${{ steps.manifest.outputs.encoded_version }}
          EXPECTED_NAME: ${{ steps.manifest.outputs.name }}
          EXPECTED_VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.error
          import urllib.request

          url = (
              "https://registry.modelcontextprotocol.io/v0.1/servers/"
              f"{os.environ['ENCODED_NAME']}/versions/{os.environ['ENCODED_VERSION']}"
          )
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("exists=false")
                  raise SystemExit(0)
              raise

          server = payload.get("server", {})
          if server.get("name") != os.environ["EXPECTED_NAME"]:
              raise SystemExit("existing Registry entry has the wrong name")
          if server.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("existing Registry entry has the wrong version")
          publisher = (
              server.get("_meta", {})
              .get("io.modelcontextprotocol.registry/publisher-provided", {})
          )
          if publisher.get("dnsDomain") != "dinglebear.ai":
              raise SystemExit("existing Registry entry has the wrong dnsDomain")
          print("exists=true")
          PY

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.exists != 'true' && inputs.auth-method == 'github-oidc'
        run: ./mcp-publisher login github-oidc

      - name: Authenticate with DNS ownership
        if: steps.registry.outputs.exists != 'true' && inputs.auth-method == 'dns'
        env:
          DOMAIN: ${{ inputs.registry-domain }}
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$DOMAIN" = dinglebear.ai
          test -n "$MCP_PRIVATE_KEY"
          ./mcp-publisher login dns --domain "$DOMAIN" --private-key "$MCP_PRIVATE_KEY"

      - name: Reject unsupported authentication method
        if: steps.registry.outputs.exists != 'true' && inputs.auth-method != 'github-oidc' && inputs.auth-method != 'dns'
        env:
          AUTH_METHOD: ${{ inputs.auth-method }}
        run: |
          echo "::error::unsupported MCP Registry auth method: $AUTH_METHOD"
          exit 1

      - name: Publish validated manifest
        if: steps.registry.outputs.exists != 'true'
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: ./mcp-publisher publish "$MANIFEST_PATH"

      - name: Verify public Registry state
        env:
          ENCODED_NAME: ${{ steps.manifest.outputs.encoded_name }}
          ENCODED_VERSION: ${{ steps.manifest.outputs.encoded_version }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          manifest = json.load(open(os.environ["MANIFEST_PATH"], encoding="utf-8"))
          url = (
              "https://registry.modelcontextprotocol.io/v0.1/servers/"
              f"{os.environ['ENCODED_NAME']}/versions/{os.environ['ENCODED_VERSION']}"
          )
          last_error = None
          for attempt in range(1, 21):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  server = payload["server"]
                  if server.get("name") != manifest["name"]:
                      raise AssertionError("public Registry name differs from manifest")
                  if server.get("version") != manifest["version"]:
                      raise AssertionError("public Registry version differs from manifest")
                  publisher = server.get("_meta", {}).get(
                      "io.modelcontextprotocol.registry/publisher-provided", {}
                  )
                  if publisher.get("dnsDomain") != "dinglebear.ai":
                      raise AssertionError("public Registry dnsDomain is not dinglebear.ai")
                  official = payload.get("_meta", {}).get(
                      "io.modelcontextprotocol.registry/official", {}
                  )
                  if official.get("status") != "active":
                      raise AssertionError("public Registry entry is not active")
                  expected = {
                      (package["registryType"], package["identifier"], package.get("version"))
                      for package in manifest["packages"]
                  }
                  actual = {
                      (package["registryType"], package["identifier"], package.get("version"))
                      for package in server.get("packages", [])
                  }
                  if expected != actual:
                      raise AssertionError(
                          f"public Registry packages differ: expected {expected}, got {actual}"
                      )
                  print(
                      f"verified active Registry entry {server['name']} {server['version']} "
                      f"(attempt {attempt})"
                  )
                  raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  if attempt < 20:
                      time.sleep(5)
          raise SystemExit(f"Registry verification failed: {last_error}")
          PY

      - name: Run caller-specific verification
        if: inputs.verify-command != ''
        env:
          COMMAND: ${{ inputs.verify-command }}
        run: bash -euo pipefail -c "$COMMAND"
