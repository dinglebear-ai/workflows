name: Runner farm acceptance

on:
  workflow_dispatch:
    inputs:
      pool:
        description: Runner pool label
        required: true
        type: choice
        options:
          - ci-pool-ops
          - ci-pool-windows
      expected_node:
        description: Node selected by the controller drain gate
        required: true
        type: string
  workflow_call:
    inputs:
      pool:
        required: true
        type: string
      expected_node:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    if: inputs.pool != 'ci-pool-windows'
    runs-on: ${{ inputs.pool }}
    timeout-minutes: 10
    steps:
      - name: Prove Linux runner execution
        shell: bash
        env:
          EXPECTED_NODE: ${{ inputs.expected_node }}
        run: |
          set -euo pipefail
          echo "acceptance_node=$EXPECTED_NODE"
          echo "github_runner=${{ runner.name }}"
          echo "runner_os=${{ runner.os }}"
          echo "runner_arch=${{ runner.arch }}"
          uname -a
          test "${{ runner.os }}" = Linux
          test "${{ runner.arch }}" = X64

  windows:
    if: inputs.pool == 'ci-pool-windows'
    runs-on: ${{ inputs.pool }}
    timeout-minutes: 10
    steps:
      - name: Prove Windows runner execution
        shell: pwsh
        env:
          EXPECTED_NODE: ${{ inputs.expected_node }}
        run: |
          Write-Output "acceptance_node=$env:EXPECTED_NODE"
          Write-Output "github_runner=${{ runner.name }}"
          Write-Output "runner_os=${{ runner.os }}"
          Write-Output "runner_arch=${{ runner.arch }}"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture
          if ("${{ runner.os }}" -ne "Windows") { throw "unexpected runner OS" }
          if ("${{ runner.arch }}" -ne "X64") { throw "unexpected runner architecture" }
