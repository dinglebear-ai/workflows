name: Reusable hosted Bun web release

on:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        required: true
      bun-version:
        type: string
        default: "1.2.19"
      working-directory:
        type: string
        default: "."
      install-command:
        type: string
        default: bun install --frozen-lockfile
      coverage-command:
        type: string
        required: true
      build-command:
        type: string
        required: true
      e2e-command:
        type: string
        default: ""
      artifact-name:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 60

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Locked install
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Coverage
        env:
          COMMAND: ${{ inputs.coverage-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Production build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Browser E2E
        if: inputs.e2e-command != ''
        env:
          COMMAND: ${{ inputs.e2e-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

