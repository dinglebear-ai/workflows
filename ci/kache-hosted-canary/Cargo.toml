[package]
# Kache 0.28.1 sync matches Cargo package names against rustc crate names.
# Use underscores so the workspace-scoped upload filter matches this fixture.
name = "kache_hosted_canary"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
