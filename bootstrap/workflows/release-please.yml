name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: dinglebear-ai/workflows/.github/workflows/release-please.yml@__WORKFLOWS_SHA__
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
